<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="55" y1="0" x2="540" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#7aa2f7"/>
      <stop offset="0.7" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes slideIn {
        0%  { opacity:0; transform:translateX(-22px); }
        100%{ opacity:1; transform:translateX(0); }
      }
      @keyframes fadeUp {
        0%  { opacity:0; transform:translateY(14px); }
        100%{ opacity:1; transform:translateY(0); }
      }
      @keyframes pulse {
        0%,100% { opacity:0.25; }
        50%     { opacity:0.6;  }
      }
      @keyframes glow {
        0%,100% { fill-opacity:0.05; }
        50%     { fill-opacity:0.10; }
      }
      .t1  { animation: slideIn .65s .10s ease both; }
      .t2  { animation: slideIn .65s .25s ease both; }
      .t3  { animation: fadeUp  .65s .42s ease both; }
      .t4  { animation: fadeUp  .65s .58s ease both; }
      .t5  { animation: fadeUp  .65s .72s ease both; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      .big { animation: glow  3s   ease-in-out infinite; }
    </style>
  </defs>

  <!-- ── Background ─────────────────────────────────────────── -->
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>

  <!-- ── Soft glow circles (right) ──────────────────────────── -->
  <circle cx="810" cy="28"  r="95" fill="#7aa2f7" fill-opacity="0.045"/>
  <circle cx="880" cy="165" r="70" fill="#bb9af7" fill-opacity="0.05"/>
  <circle cx="725" cy="188" r="48" fill="#7dcfff" fill-opacity="0.04"/>

  <!-- ── Large faded &lt;/&gt; decoration ─────────────────────── -->
  <text class="big" x="575" y="168"
        font-family="Arial,sans-serif" font-size="126" font-weight="900"
        fill="#7aa2f7" fill-opacity="0.06">&lt;/&gt;</text>

  <!-- ── Dot grid (6 × 4, spacing 22px, top-right) ──────────── -->
  <circle class="dot" cx="572" cy="16" r="2.3" fill="#a9b1d6" fill-opacity="0.35"/>
  <circle class="dot" cx="594" cy="16" r="2.3" fill="#a9b1d6" fill-opacity="0.35"/>
  <circle class="dot" cx="616" cy="16" r="2.3" fill="#a9b1d6" fill-opacity="0.35"/>
  <circle class="dot" cx="638" cy="16" r="2.3" fill="#a9b1d6" fill-opacity="0.35"/>
  <circle class="dot" cx="660" cy="16" r="2.3" fill="#a9b1d6" fill-opacity="0.35"/>
  <circle class="dot" cx="682" cy="16" r="2.3" fill="#a9b1d6" fill-opacity="0.35"/>

  <circle cx="572" cy="38" r="2.3" fill="#a9b1d6" fill-opacity="0.24"/>
  <circle cx="594" cy="38" r="2.3" fill="#a9b1d6" fill-opacity="0.24"/>
  <circle cx="616" cy="38" r="2.3" fill="#a9b1d6" fill-opacity="0.24"/>
  <circle cx="638" cy="38" r="2.3" fill="#a9b1d6" fill-opacity="0.24"/>
  <circle cx="660" cy="38" r="2.3" fill="#a9b1d6" fill-opacity="0.24"/>
  <circle cx="682" cy="38" r="2.3" fill="#a9b1d6" fill-opacity="0.24"/>

  <circle cx="572" cy="60" r="2.3" fill="#a9b1d6" fill-opacity="0.15"/>
  <circle cx="594" cy="60" r="2.3" fill="#a9b1d6" fill-opacity="0.15"/>
  <circle cx="616" cy="60" r="2.3" fill="#a9b1d6" fill-opacity="0.15"/>
  <circle cx="638" cy="60" r="2.3" fill="#a9b1d6" fill-opacity="0.15"/>
  <circle cx="660" cy="60" r="2.3" fill="#a9b1d6" fill-opacity="0.15"/>
  <circle cx="682" cy="60" r="2.3" fill="#a9b1d6" fill-opacity="0.15"/>

  <circle cx="572" cy="82" r="2.3" fill="#a9b1d6" fill-opacity="0.07"/>
  <circle cx="594" cy="82" r="2.3" fill="#a9b1d6" fill-opacity="0.07"/>
  <circle cx="616" cy="82" r="2.3" fill="#a9b1d6" fill-opacity="0.07"/>
  <circle cx="638" cy="82" r="2.3" fill="#a9b1d6" fill-opacity="0.07"/>
  <circle cx="660" cy="82" r="2.3" fill="#a9b1d6" fill-opacity="0.07"/>
  <circle cx="682" cy="82" r="2.3" fill="#a9b1d6" fill-opacity="0.07"/>

  <!-- ── Left text content ───────────────────────────────────── -->

  <!-- Opening code tag -->
  <text class="t1" x="55" y="50"
        font-family="'Courier New',Courier,monospace" font-size="13"
        fill="#7dcfff" fill-opacity="0.9">&lt;developer&gt;</text>

  <!-- Name with gradient -->
  <text class="t2" x="55" y="106"
        font-family="'Arial Black',Arial,sans-serif" font-size="45" font-weight="900"
        fill="url(#nameGrad)">Tanmay Patel</text>

  <!-- Subtitle -->
  <text class="t3" x="58" y="132"
        font-family="Arial,sans-serif" font-size="13.5"
        fill="#a9b1d6">Full Stack Developer  ·  MERN Stack  ·  B.Tech CSE '26</text>

  <!-- Skill pills -->
  <g class="t4">
    <!-- React.js -->
    <rect x="58"  y="148" width="63"  height="21" rx="10.5"
          fill="#7aa2f7" fill-opacity="0.13" stroke="#7aa2f7" stroke-opacity="0.55" stroke-width="1"/>
    <text x="89"  y="163" font-family="Arial,sans-serif" font-size="10.5"
          fill="#7aa2f7" text-anchor="middle" font-weight="700">React.js</text>

    <!-- Node.js -->
    <rect x="129" y="148" width="63"  height="21" rx="10.5"
          fill="#9ece6a" fill-opacity="0.13" stroke="#9ece6a" stroke-opacity="0.55" stroke-width="1"/>
    <text x="160" y="163" font-family="Arial,sans-serif" font-size="10.5"
          fill="#9ece6a" text-anchor="middle" font-weight="700">Node.js</text>

    <!-- MongoDB -->
    <rect x="200" y="148" width="73"  height="21" rx="10.5"
          fill="#73daca" fill-opacity="0.13" stroke="#73daca" stroke-opacity="0.55" stroke-width="1"/>
    <text x="237" y="163" font-family="Arial,sans-serif" font-size="10.5"
          fill="#73daca" text-anchor="middle" font-weight="700">MongoDB</text>

    <!-- Python -->
    <rect x="281" y="148" width="60"  height="21" rx="10.5"
          fill="#e0af68" fill-opacity="0.13" stroke="#e0af68" stroke-opacity="0.55" stroke-width="1"/>
    <text x="311" y="163" font-family="Arial,sans-serif" font-size="10.5"
          fill="#e0af68" text-anchor="middle" font-weight="700">Python</text>

    <!-- MERN -->
    <rect x="349" y="148" width="55"  height="21" rx="10.5"
          fill="#bb9af7" fill-opacity="0.13" stroke="#bb9af7" stroke-opacity="0.55" stroke-width="1"/>
    <text x="376" y="163" font-family="Arial,sans-serif" font-size="10.5"
          fill="#bb9af7" text-anchor="middle" font-weight="700">MERN</text>
  </g>

  <!-- Closing code tag -->
  <text class="t5" x="55" y="192"
        font-family="'Courier New',Courier,monospace" font-size="13"
        fill="#7dcfff" fill-opacity="0.9">&lt;/developer&gt;</text>

  <!-- Bottom gradient accent line -->
  <rect x="55" y="197" width="360" height="2" rx="1" fill="url(#accentLine)"/>

</svg>
